services:
  db:
    image: postgres:16-alpine
    container_name: job-hunter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports:
      - "5433:5432"
    volumes:
      - job-hunter-pgdata:/var/lib/postgresql/data

volumes:
  job-hunter-pgdata:
    name: job_hunter_job-hunter-pgdata
